<header class="vp-navbar" role="banner">
  <div class="vp-navbar-inner">
    <a class="vp-site-name" href="{{ "/" | relURL }}">{{ site.Title }}</a>

    <div class="vp-navbar-actions">
      <button type="button" class="vp-icon-btn" data-search-open aria-label="Search" title="Search" aria-expanded="false">
        {{ partial "icon" "fas fa-search" }}
      </button>
      <button type="button" class="theme-toggle" data-theme-toggle aria-label="Toggle dark mode" title="Toggle dark mode">
        {{ partial "icon" "far fa-sun theme-toggle-light" }}
        {{ partial "icon" "far fa-moon theme-toggle-dark" }}
      </button>
    </div>
  </div>
</header>
