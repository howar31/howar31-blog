<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 640 320" font-family="-apple-system, 'PingFang TC', 'Microsoft JhengHei', sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .box{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.4;}
      .main{fill:#f1f5f9;stroke:#94a3b8;stroke-width:1.5;}
      .sub{fill:#eff6ff;stroke:#3b82f6;stroke-width:1.6;}
      .good{fill:#ecfdf5;stroke:#10b981;stroke-width:1.4;}
      .ph{fill:#0f172a;font-size:15px;font-weight:700;}
      .t{fill:#1e293b;font-size:13px;}
      .ts{fill:#475569;font-size:12px;}
      .edge{stroke:#64748b;stroke-width:1.6;fill:none;}
    </style>
  </defs>
  <rect x="0" y="0" width="640" height="320" fill="#f8fafc"/>

  <!-- main conversation -->
  <rect x="30" y="70" width="180" height="190" rx="12" class="main"/>
  <text x="120" y="96" text-anchor="middle" class="ph">主對話</text>
  <rect x="48" y="206" width="144" height="38" rx="8" class="good"/>
  <text x="120" y="223" text-anchor="middle" class="t">＋ 一行摘要</text>
  <text x="120" y="238" text-anchor="middle" class="ts">乾淨無雜訊</text>

  <!-- subagent panel -->
  <rect x="300" y="44" width="300" height="248" rx="14" class="sub"/>
  <text x="450" y="70" text-anchor="middle" class="ph">Subagent</text>
  <text x="450" y="88" text-anchor="middle" class="ts">（自己的對話視窗）</text>

  <rect x="328" y="104" width="244" height="32" rx="7" class="box"/>
  <text x="450" y="124" text-anchor="middle" class="t">讀進大量檔案</text>
  <rect x="328" y="144" width="244" height="32" rx="7" class="box"/>
  <text x="450" y="164" text-anchor="middle" class="t">跑指令、滿屏 log</text>
  <rect x="328" y="184" width="244" height="32" rx="7" class="box"/>
  <text x="450" y="204" text-anchor="middle" class="t">試錯的彎路</text>
  <text x="450" y="246" text-anchor="middle" class="ts">↑ 雜訊全留在這裡，不流回主對話</text>

  <!-- arrows -->
  <line x1="210" y1="120" x2="300" y2="120" class="edge" marker-end="url(#ah)"/>
  <text x="255" y="112" text-anchor="middle" class="ts">① 派任務</text>
  <line x1="300" y1="232" x2="210" y2="232" class="edge" marker-end="url(#ah)"/>
  <text x="255" y="224" text-anchor="middle" class="ts">② 只回摘要</text>
</svg>
