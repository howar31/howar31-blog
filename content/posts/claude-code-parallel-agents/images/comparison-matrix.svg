<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="720" viewBox="0 0 760 360" font-family="-apple-system, 'PingFang TC', 'Microsoft JhengHei', sans-serif">
  <defs>
    <g id="chk"><path d="M-8 1 L-2 8 L9 -8" fill="none" stroke="#16a34a" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g id="crs"><path d="M-7 -7 L7 7 M7 -7 L-7 7" fill="none" stroke="#dc2626" stroke-width="3.2" stroke-linecap="round"/></g>
    <style>
      .c-sub{fill:#eff6ff;stroke:#3b82f6;stroke-width:1.6;}
      .c-wt{fill:#ecfdf5;stroke:#10b981;stroke-width:1.6;}
      .c-wf{fill:#f5f3ff;stroke:#8b5cf6;stroke-width:1.6;}
      .c-at{fill:#fffbeb;stroke:#f59e0b;stroke-width:1.6;}
      .grid{stroke:#e2e8f0;stroke-width:1.2;}
      .hd{fill:#0f172a;font-size:14px;font-weight:700;}
      .lbl{fill:#334155;font-size:13px;font-weight:700;}
      .t{fill:#1e293b;font-size:12.5px;}
    </style>
  </defs>
  <rect x="0" y="0" width="760" height="360" fill="#f8fafc"/>

  <!-- grid lines -->
  <line x1="18" y1="86" x2="742" y2="86" class="grid"/>
  <line x1="18" y1="138" x2="742" y2="138" class="grid"/>
  <line x1="18" y1="190" x2="742" y2="190" class="grid"/>
  <line x1="18" y1="242" x2="742" y2="242" class="grid"/>
  <line x1="18" y1="294" x2="742" y2="294" class="grid"/>
  <line x1="150" y1="40" x2="150" y2="346" class="grid"/>
  <line x1="295" y1="40" x2="295" y2="346" class="grid"/>
  <line x1="439" y1="40" x2="439" y2="346" class="grid"/>
  <line x1="583" y1="40" x2="583" y2="346" class="grid"/>

  <!-- header -->
  <text x="84" y="68" text-anchor="middle" class="hd">面向</text>
  <rect x="152" y="42" width="141" height="42" rx="9" class="c-sub"/>
  <text x="222" y="68" text-anchor="middle" class="hd">Subagent</text>
  <rect x="297" y="42" width="141" height="42" rx="9" class="c-wt"/>
  <text x="367" y="68" text-anchor="middle" class="hd">Worktree</text>
  <rect x="441" y="42" width="141" height="42" rx="9" class="c-wf"/>
  <text x="511" y="68" text-anchor="middle" class="hd">Workflow</text>
  <rect x="585" y="42" width="141" height="42" rx="9" class="c-at"/>
  <text x="655" y="68" text-anchor="middle" class="hd">Agent team</text>

  <!-- row labels -->
  <text x="84" y="117" text-anchor="middle" class="lbl">獨立 git 目錄？</text>
  <text x="84" y="169" text-anchor="middle" class="lbl">獨立對話視窗？</text>
  <text x="84" y="221" text-anchor="middle" class="lbl">協調方式</text>
  <text x="84" y="273" text-anchor="middle" class="lbl">相對成本</text>
  <text x="84" y="325" text-anchor="middle" class="lbl">最適合</text>

  <!-- r1 獨立 git 目錄 -->
  <use href="#crs" x="222" y="112"/>
  <use href="#chk" x="367" y="112"/>
  <use href="#crs" x="511" y="112"/>
  <use href="#crs" x="655" y="112"/>

  <!-- r2 獨立對話視窗 -->
  <use href="#chk" x="222" y="164"/>
  <use href="#chk" x="367" y="164"/>
  <use href="#chk" x="511" y="164"/>
  <use href="#chk" x="655" y="164"/>

  <!-- r3 協調方式 -->
  <text x="222" y="224" text-anchor="middle" class="t">派發→回報</text>
  <text x="367" y="224" text-anchor="middle" class="t">純檔案隔離</text>
  <text x="511" y="224" text-anchor="middle" class="t">腳本驅動</text>
  <text x="655" y="224" text-anchor="middle" class="t">AI 互傳訊息</text>

  <!-- r4 相對成本 -->
  <text x="222" y="276" text-anchor="middle" class="t">低</text>
  <text x="367" y="276" text-anchor="middle" class="t">中</text>
  <text x="511" y="276" text-anchor="middle" class="t">中</text>
  <text x="655" y="276" text-anchor="middle" class="t">高（約 7×）</text>

  <!-- r5 最適合 -->
  <text x="222" y="328" text-anchor="middle" class="t">聚焦小任務</text>
  <text x="367" y="328" text-anchor="middle" class="t">不同分支平行</text>
  <text x="511" y="328" text-anchor="middle" class="t">大規模重複</text>
  <text x="655" y="328" text-anchor="middle" class="t">討論協作</text>
</svg>
