<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="940" viewBox="0 0 760 470" font-family="-apple-system, 'PingFang TC', 'Microsoft JhengHei', sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .axis{stroke:#94a3b8;stroke-width:1.5;fill:none;}
      .t{fill:#1e293b;font-size:15px;font-weight:700;}
      .ts{fill:#475569;font-size:12.5px;}
      .ax{fill:#64748b;font-size:13px;font-weight:700;}
      .c-sub{fill:#eff6ff;stroke:#3b82f6;stroke-width:1.6;}
      .c-wt{fill:#ecfdf5;stroke:#10b981;stroke-width:1.6;}
      .c-wf{fill:#f5f3ff;stroke:#8b5cf6;stroke-width:1.6;}
      .c-at{fill:#fffbeb;stroke:#f59e0b;stroke-width:1.6;}
    </style>
  </defs>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>

  <!-- axes -->
  <line x1="110" y1="380" x2="710" y2="380" class="axis" marker-end="url(#ah)"/>
  <line x1="110" y1="380" x2="110" y2="58" class="axis" marker-end="url(#ah)"/>
  <text x="40" y="220" class="ax" transform="rotate(-90 40 220)" text-anchor="middle">協調程度</text>
  <text x="98" y="372" text-anchor="end" class="ts">回報</text>
  <text x="98" y="92" text-anchor="end" class="ts">協作</text>
  <text x="220" y="402" text-anchor="middle" class="ts">對話記憶體隔離</text>
  <text x="560" y="402" text-anchor="middle" class="ts">檔案系統隔離</text>
  <text x="700" y="402" text-anchor="end" class="ax">隔離層級 →</text>

  <!-- worktree (file isolation, low coordination) -->
  <rect x="470" y="292" width="180" height="56" rx="12" class="c-wt"/>
  <text x="560" y="316" text-anchor="middle" class="t">Worktree</text>
  <text x="560" y="336" text-anchor="middle" class="ts">獨立檔案桌·不同分支</text>

  <!-- subagent (memory isolation, low coordination) -->
  <rect x="130" y="292" width="180" height="56" rx="12" class="c-sub"/>
  <text x="220" y="316" text-anchor="middle" class="t">Subagent</text>
  <text x="220" y="336" text-anchor="middle" class="ts">小幫手·回報結論</text>

  <!-- workflow (script coordinates many) -->
  <rect x="130" y="172" width="180" height="56" rx="12" class="c-wf"/>
  <text x="220" y="196" text-anchor="middle" class="t">Workflow</text>
  <text x="220" y="216" text-anchor="middle" class="ts">腳本指揮一群小幫手</text>

  <!-- agent team (AI-to-AI collaboration) -->
  <rect x="130" y="72" width="180" height="56" rx="12" class="c-at"/>
  <text x="220" y="96" text-anchor="middle" class="t">Agent team</text>
  <text x="220" y="116" text-anchor="middle" class="ts">會互相講話的團隊</text>
</svg>
