<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="700" viewBox="0 0 720 350" font-family="-apple-system, 'PingFang TC', 'Microsoft JhengHei', sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .lead{fill:#fde68a;stroke:#d97706;stroke-width:1.8;}
      .mate{fill:#fffbeb;stroke:#f59e0b;stroke-width:1.6;}
      .tasks{fill:#ffffff;stroke:#94a3b8;stroke-width:1.5;}
      .pg{fill:#e2e8f0;stroke:#94a3b8;stroke-width:1;}
      .pb{fill:#bfdbfe;stroke:#3b82f6;stroke-width:1;}
      .pgn{fill:#bbf7d0;stroke:#10b981;stroke-width:1;}
      .ph{fill:#0f172a;font-size:14px;font-weight:700;}
      .t{fill:#1e293b;font-size:13px;}
      .ts{fill:#475569;font-size:11.5px;}
      .edge{stroke:#94a3b8;stroke-width:1.4;fill:none;}
      .msg{stroke:#f59e0b;stroke-width:1.8;fill:none;}
    </style>
  </defs>
  <rect x="0" y="0" width="720" height="350" fill="#f8fafc"/>

  <!-- lead -->
  <rect x="280" y="22" width="160" height="42" rx="11" class="lead"/>
  <text x="360" y="48" text-anchor="middle" class="t" font-weight="700">隊長（lead）</text>

  <!-- shared task list -->
  <rect x="252" y="106" width="216" height="92" rx="12" class="tasks"/>
  <text x="360" y="128" text-anchor="middle" class="ph">共享任務清單</text>
  <rect x="266" y="140" width="60" height="24" rx="6" class="pg"/><text x="296" y="157" text-anchor="middle" class="ts">待辦</text>
  <rect x="330" y="140" width="60" height="24" rx="6" class="pb"/><text x="360" y="157" text-anchor="middle" class="ts">進行中</text>
  <rect x="394" y="140" width="60" height="24" rx="6" class="pgn"/><text x="424" y="157" text-anchor="middle" class="ts">完成</text>
  <text x="360" y="186" text-anchor="middle" class="ts">成員自己認領、可設相依</text>

  <line x1="360" y1="64" x2="360" y2="106" class="edge" marker-end="url(#ah)"/>

  <!-- teammates -->
  <rect x="60" y="248" width="170" height="56" rx="12" class="mate"/>
  <text x="145" y="272" text-anchor="middle" class="t" font-weight="700">隊員 A</text>
  <text x="145" y="291" text-anchor="middle" class="ts">安全性 review</text>

  <rect x="275" y="248" width="170" height="56" rx="12" class="mate"/>
  <text x="360" y="272" text-anchor="middle" class="t" font-weight="700">隊員 B</text>
  <text x="360" y="291" text-anchor="middle" class="ts">效能</text>

  <rect x="490" y="248" width="170" height="56" rx="12" class="mate"/>
  <text x="575" y="272" text-anchor="middle" class="t" font-weight="700">隊員 C</text>
  <text x="575" y="291" text-anchor="middle" class="ts">測試</text>

  <line x1="300" y1="198" x2="145" y2="248" class="edge"/>
  <line x1="360" y1="198" x2="360" y2="248" class="edge"/>
  <line x1="420" y1="198" x2="575" y2="248" class="edge"/>

  <!-- peer messaging -->
  <line x1="230" y1="276" x2="275" y2="276" class="msg" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <line x1="445" y1="276" x2="490" y2="276" class="msg" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="360" y="332" text-anchor="middle" class="t">隊員之間可直接互傳訊息，不需透過隊長轉達</text>
</svg>
