<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="700" viewBox="0 0 720 350" font-family="-apple-system, 'PingFang TC', 'Microsoft JhengHei', sans-serif">
  <defs>
    <style>
      .repo{fill:#e2e8f0;stroke:#94a3b8;stroke-width:1.6;}
      .main{fill:#ffffff;stroke:#94a3b8;stroke-width:1.5;}
      .wt{fill:#ecfdf5;stroke:#10b981;stroke-width:1.6;}
      .file{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.2;}
      .ph{fill:#0f172a;font-size:14px;font-weight:700;}
      .t{fill:#1e293b;font-size:13px;}
      .ts{fill:#475569;font-size:12px;}
      .chip{font-size:12px;font-weight:700;fill:#334155;}
      .edge{stroke:#94a3b8;stroke-width:1.5;fill:none;}
    </style>
  </defs>
  <rect x="0" y="0" width="720" height="350" fill="#f8fafc"/>

  <!-- shared repo -->
  <rect x="270" y="26" width="180" height="56" rx="12" class="repo"/>
  <text x="360" y="50" text-anchor="middle" class="ph">Git repo</text>
  <text x="360" y="69" text-anchor="middle" class="ts">（共享版本歷史）</text>

  <line x1="360" y1="82" x2="135" y2="168" class="edge"/>
  <line x1="360" y1="82" x2="360" y2="168" class="edge"/>
  <line x1="360" y1="82" x2="585" y2="168" class="edge"/>

  <!-- folder: main -->
  <rect x="40" y="170" width="190" height="128" rx="12" class="main"/>
  <text x="135" y="194" text-anchor="middle" class="ph">主資料夾</text>
  <rect x="90" y="204" width="90" height="22" rx="11" fill="#ffffff" stroke="#94a3b8"/>
  <text x="135" y="219" text-anchor="middle" class="chip">main</text>
  <rect x="92" y="240" width="22" height="28" rx="3" class="file"/>
  <rect x="124" y="240" width="22" height="28" rx="3" class="file"/>
  <rect x="156" y="240" width="22" height="28" rx="3" class="file"/>
  <text x="135" y="288" text-anchor="middle" class="ts">獨立檔案</text>

  <!-- folder: feature-x worktree -->
  <rect x="265" y="170" width="190" height="128" rx="12" class="wt"/>
  <text x="360" y="190" text-anchor="middle" class="ts">.claude/worktrees/</text>
  <rect x="315" y="200" width="90" height="22" rx="11" fill="#ffffff" stroke="#10b981"/>
  <text x="360" y="215" text-anchor="middle" class="chip">feature-x</text>
  <rect x="317" y="238" width="22" height="28" rx="3" class="file"/>
  <rect x="349" y="238" width="22" height="28" rx="3" class="file"/>
  <rect x="381" y="238" width="22" height="28" rx="3" class="file"/>
  <text x="360" y="288" text-anchor="middle" class="ts">獨立檔案</text>

  <!-- folder: bugfix worktree -->
  <rect x="490" y="170" width="190" height="128" rx="12" class="wt"/>
  <text x="585" y="190" text-anchor="middle" class="ts">.claude/worktrees/</text>
  <rect x="540" y="200" width="90" height="22" rx="11" fill="#ffffff" stroke="#10b981"/>
  <text x="585" y="215" text-anchor="middle" class="chip">bugfix</text>
  <rect x="542" y="238" width="22" height="28" rx="3" class="file"/>
  <rect x="574" y="238" width="22" height="28" rx="3" class="file"/>
  <rect x="606" y="238" width="22" height="28" rx="3" class="file"/>
  <text x="585" y="288" text-anchor="middle" class="ts">獨立檔案</text>

  <text x="360" y="328" text-anchor="middle" class="t">同一份版本歷史，各資料夾的檔案完全獨立、改動互不覆蓋</text>
</svg>
