<svg xmlns="http://www.w3.org/2000/svg" width="2040" height="880" viewBox="0 0 1020 440" font-family="-apple-system, 'PingFang TC', 'Microsoft JhengHei', sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .box{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.5;}
      .gate{fill:#eff6ff;stroke:#3b82f6;stroke-width:1.5;}
      .out{fill:#ecfdf5;stroke:#10b981;stroke-width:1.5;}
      .skip{fill:#f1f5f9;stroke:#94a3b8;stroke-width:1.5;}
      .t{fill:#1e293b;font-size:14.5px;}
      .lbl{fill:#475569;font-size:12px;font-weight:600;}
      .edge{stroke:#64748b;stroke-width:1.5;fill:none;}
    </style>
  </defs>
  <rect x="0" y="0" width="1020" height="440" fill="#f8fafc"/>

  <!-- PR merge -->
  <rect x="30" y="200" width="130" height="40" rx="10" class="box"/>
  <text x="95" y="225" text-anchor="middle" class="t">PR merge to main</text>

  <line x1="160" y1="220" x2="187" y2="220" class="edge" marker-end="url(#ah)"/>

  <!-- diamond: VERSION changed? (widened to fit text) -->
  <polygon points="290,180 390,220 290,260 190,220" class="gate"/>
  <text x="290" y="225" text-anchor="middle" class="t">VERSION changed?</text>

  <!-- no branch -->
  <path d="M 340 200 L 425 105" class="edge" marker-end="url(#ah)"/>
  <text x="380" y="148" text-anchor="middle" class="lbl">no</text>

  <rect x="430" y="80" width="130" height="40" rx="10" class="skip"/>
  <text x="495" y="105" text-anchor="middle" class="t">no release</text>

  <!-- yes branch -->
  <path d="M 340 240 L 425 315" class="edge" marker-end="url(#ah)"/>
  <text x="380" y="290" text-anchor="middle" class="lbl">yes</text>

  <!-- derive tag (widened to fit text) -->
  <rect x="430" y="300" width="200" height="40" rx="10" class="box"/>
  <text x="530" y="325" text-anchor="middle" class="t">derive tag from VERSION</text>

  <line x1="630" y1="320" x2="657" y2="320" class="edge" marker-end="url(#ah)"/>

  <rect x="660" y="300" width="120" height="40" rx="10" class="box"/>
  <text x="720" y="325" text-anchor="middle" class="t">goreleaser</text>

  <!-- outputs (arrows + boxes) -->
  <line x1="780" y1="320" x2="807" y2="260" class="edge" marker-end="url(#ah)"/>
  <line x1="780" y1="320" x2="807" y2="320" class="edge" marker-end="url(#ah)"/>
  <line x1="780" y1="320" x2="807" y2="380" class="edge" marker-end="url(#ah)"/>

  <rect x="810" y="240" width="180" height="40" rx="10" class="out"/>
  <text x="900" y="265" text-anchor="middle" class="t">npm publish</text>

  <rect x="810" y="300" width="180" height="40" rx="10" class="out"/>
  <text x="900" y="325" text-anchor="middle" class="t">Homebrew tap update</text>

  <rect x="810" y="360" width="180" height="40" rx="10" class="out"/>
  <text x="900" y="385" text-anchor="middle" class="t">GitHub Release</text>
</svg>
