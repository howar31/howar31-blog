<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="1920" height="1080" role="img" aria-label="Glimpr 多引擎架構：control、overlay、image-editor 三種角色與 native 層的關係">
  <style>
    text { font-family: -apple-system,'PingFang TC','Microsoft JhengHei',sans-serif; fill: #0f172a; font-size: 13px; }
    .heading { font-size: 15px; font-weight: 700; }
    .sub { fill: #475569; font-size: 12px; }
    .chip-text { font-size: 12px; fill: #334155; }
    .arrow { stroke: #94a3b8; stroke-width: 2; fill: none; }
  </style>
  <rect x="0.5" y="0.5" width="959" height="539" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>

  <rect x="40" y="36" width="880" height="260" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="60" y="64" class="heading">一個 Flutter process：所有 engine 跑同一個 main()</text>
  <text x="60" y="88" class="sub">每個 engine 啟動時經由 glimpr/role channel 向 native 取得角色，掛載對應的 widget tree</text>

  <rect x="64" y="110" width="256" height="150" rx="8" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="192" y="140" text-anchor="middle" font-weight="700">control engine</text>
  <text x="192" y="168" text-anchor="middle" class="sub">tray / 選單、Settings UI</text>
  <text x="192" y="190" text-anchor="middle" class="sub">快捷鍵調度、流程編排</text>
  <text x="192" y="212" text-anchor="middle" class="sub">常駐</text>

  <rect x="360" y="118" width="256" height="150" rx="8" fill="#ffffff" stroke="#c7d2fe" opacity="0.55"/>
  <rect x="356" y="114" width="256" height="150" rx="8" fill="#ffffff" stroke="#c7d2fe" opacity="0.75"/>
  <rect x="352" y="110" width="256" height="150" rx="8" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="480" y="140" text-anchor="middle" font-weight="700">overlay engine × 每個顯示器</text>
  <text x="480" y="168" text-anchor="middle" class="sub">全螢幕凍結畫布 + 標註</text>
  <text x="480" y="190" text-anchor="middle" class="sub">macOS 啟動即預熱（備用池）</text>
  <text x="480" y="212" text-anchor="middle" class="sub">Windows 需要時才建</text>

  <rect x="640" y="110" width="256" height="150" rx="8" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="768" y="140" text-anchor="middle" font-weight="700">image-editor engine</text>
  <text x="768" y="168" text-anchor="middle" class="sub">獨立編輯視窗</text>
  <text x="768" y="190" text-anchor="middle" class="sub">與 overlay 共用 EditorCore</text>

  <path class="arrow" d="M 192 296 L 192 330 M 186 322 L 192 332 L 198 322"/>
  <path class="arrow" d="M 768 296 L 768 330 M 762 322 L 768 332 L 774 322"/>
  <text x="480" y="320" text-anchor="middle" class="sub">platform channel：大圖一律傳 raw bytes（BGRA），不做 encode-to-transport</text>

  <rect x="40" y="340" width="880" height="140" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="60" y="368" class="heading">native 層（Swift / C++）：擁有像素與視窗</text>

  <rect x="60" y="384" width="216" height="30" rx="15" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="168" y="404" text-anchor="middle" class="chip-text">截圖 ScreenCaptureKit / WGC</text>
  <rect x="288" y="384" width="248" height="30" rx="15" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="412" y="404" text-anchor="middle" class="chip-text">錄影 AVAssetWriter / Media Foundation</text>
  <rect x="548" y="384" width="150" height="30" rx="15" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="623" y="404" text-anchor="middle" class="chip-text">全域快捷鍵</text>
  <rect x="710" y="384" width="150" height="30" rx="15" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="785" y="404" text-anchor="middle" class="chip-text">tray / 選單</text>

  <rect x="60" y="426" width="150" height="30" rx="15" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="135" y="446" text-anchor="middle" class="chip-text">clipboard</text>
  <rect x="222" y="426" width="150" height="30" rx="15" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="297" y="446" text-anchor="middle" class="chip-text">pin 視窗</text>
  <rect x="384" y="426" width="150" height="30" rx="15" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="459" y="446" text-anchor="middle" class="chip-text">HDR 合成</text>
  <rect x="546" y="426" width="150" height="30" rx="15" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="621" y="446" text-anchor="middle" class="chip-text">crash dump</text>
  <rect x="708" y="426" width="150" height="30" rx="15" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="783" y="446" text-anchor="middle" class="chip-text">self-update</text>

  <text x="480" y="512" text-anchor="middle" class="sub">engine 生命週期是唯一的平台差異：macOS 僅啟動期建立的 engine 會渲染 → 全部預熱；Windows 可於執行期建立 → 延遲建立</text>
</svg>
