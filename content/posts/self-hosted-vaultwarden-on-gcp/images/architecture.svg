<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="1400" viewBox="0 0 920 700" font-family="-apple-system, 'PingFang TC', 'Microsoft JhengHei', sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .box{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.5;rx:10;}
      .accent{fill:#eff6ff;stroke:#3b82f6;}
      .warn{fill:#fef2f2;stroke:#ef4444;}
      .store{fill:#f5f3ff;stroke:#8b5cf6;}
      .t{fill:#1e293b;font-size:15px;}
      .ts{fill:#475569;font-size:12.5px;}
      .lbl{fill:#475569;font-size:12px;font-weight:600;}
      .edge{stroke:#64748b;stroke-width:1.5;fill:none;}
      .title{fill:#0f172a;font-size:19px;font-weight:700;}
    </style>
  </defs>
  <rect x="0" y="0" width="920" height="700" fill="#f8fafc"/>
  <text x="460" y="36" text-anchor="middle" class="title">GCP 上的 Vaultwarden 架構</text>

  <!-- clients -->
  <rect x="200" y="58" width="520" height="46" rx="10" class="box"/>
  <text x="460" y="86" text-anchor="middle" class="t">用戶端　瀏覽器 · 手機 App · 桌面版 · 瀏覽器外掛</text>
  <line x1="460" y1="104" x2="460" y2="124" class="edge" marker-end="url(#ah)"/>

  <!-- DNS -->
  <rect x="300" y="124" width="320" height="40" rx="10" class="box"/>
  <text x="460" y="149" text-anchor="middle" class="t">vault.example.com　·　Cloud DNS</text>
  <line x1="460" y1="164" x2="460" y2="184" class="edge" marker-end="url(#ah)"/>

  <!-- LB -->
  <rect x="270" y="184" width="380" height="44" rx="10" class="accent"/>
  <text x="460" y="211" text-anchor="middle" class="t">External HTTPS Load Balancer　受管 TLS</text>
  <line x1="460" y1="228" x2="460" y2="248" class="edge" marker-end="url(#ah)"/>

  <!-- URL map -->
  <rect x="320" y="248" width="280" height="40" rx="10" class="box"/>
  <text x="460" y="273" text-anchor="middle" class="t">URL Map · Path Matcher</text>

  <!-- split arrows -->
  <line x1="420" y1="288" x2="250" y2="322" class="edge" marker-end="url(#ah)"/>
  <text x="300" y="305" class="lbl">/admin/*</text>
  <line x1="500" y1="288" x2="670" y2="322" class="edge" marker-end="url(#ah)"/>
  <text x="600" y="305" class="lbl">/*</text>

  <!-- admin backend (IAP) -->
  <rect x="70" y="322" width="320" height="58" rx="10" class="warn"/>
  <text x="230" y="346" text-anchor="middle" class="t">IAP　→　vault-be-admin</text>
  <text x="230" y="366" text-anchor="middle" class="ts">後台 /admin 需 Google 登入</text>

  <!-- public backend -->
  <rect x="530" y="322" width="320" height="58" rx="10" class="box"/>
  <text x="690" y="346" text-anchor="middle" class="t">vault-be-public</text>
  <text x="690" y="366" text-anchor="middle" class="ts">公開路徑,所有用戶端走這條</text>

  <!-- converge to NEG -->
  <line x1="230" y1="380" x2="420" y2="418" class="edge" marker-end="url(#ah)"/>
  <line x1="690" y1="380" x2="500" y2="418" class="edge" marker-end="url(#ah)"/>
  <rect x="330" y="418" width="260" height="40" rx="10" class="box"/>
  <text x="460" y="443" text-anchor="middle" class="t">Serverless NEG</text>
  <line x1="460" y1="458" x2="460" y2="478" class="edge" marker-end="url(#ah)"/>

  <!-- Cloud Run -->
  <rect x="250" y="478" width="420" height="48" rx="10" class="accent"/>
  <text x="460" y="500" text-anchor="middle" class="t">Cloud Run　vaultwarden</text>
  <text x="460" y="518" text-anchor="middle" class="ts">min-instances=1　·　Direct VPC egress</text>

  <!-- SSO side -->
  <rect x="690" y="478" width="200" height="48" rx="10" class="store"/>
  <text x="790" y="500" text-anchor="middle" class="t">Google SSO</text>
  <text x="790" y="518" text-anchor="middle" class="ts">OIDC · 鎖公司網域</text>
  <line x1="690" y1="502" x2="672" y2="502" class="edge" marker-end="url(#ah)"/>

  <!-- dependencies -->
  <line x1="360" y1="526" x2="200" y2="566" class="edge" marker-end="url(#ah)"/>
  <line x1="460" y1="526" x2="460" y2="566" class="edge" marker-end="url(#ah)"/>
  <line x1="560" y1="526" x2="720" y2="566" class="edge" marker-end="url(#ah)"/>

  <rect x="50" y="566" width="300" height="60" rx="10" class="store"/>
  <text x="200" y="591" text-anchor="middle" class="t">Cloud SQL　Postgres</text>
  <text x="200" y="611" text-anchor="middle" class="ts">私有 IP · 每日備份 + PITR</text>

  <rect x="370" y="566" width="180" height="60" rx="10" class="store"/>
  <text x="460" y="591" text-anchor="middle" class="t">GCS　/data</text>
  <text x="460" y="611" text-anchor="middle" class="ts">rsa_key · 附件</text>

  <rect x="570" y="566" width="300" height="60" rx="10" class="store"/>
  <text x="720" y="591" text-anchor="middle" class="t">Secret Manager</text>
  <text x="720" y="611" text-anchor="middle" class="ts">ADMIN_TOKEN · DB · SSO secret</text>

  <text x="460" y="664" text-anchor="middle" class="ts">關鍵:IAP 只套在 /admin;用戶端流量走公開路徑,不經 IAP。</text>
</svg>
