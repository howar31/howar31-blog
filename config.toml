baseURL = "https://blog.howar31.com/"
languageCode = "zh-tw"
title = "Howar31 Blog"
enableRobotsTXT = true
enableEmoji = true
enableGitInfo = true

# CJK word counting. Hugo's .Summary / .WordCount / .ReadingTime are
# word-based (whitespace-delimited); Chinese prose has almost no spaces, so
# without this a whole post counted as a handful of "words": .Summary
# degenerated into the full article and reading time under-reported Chinese
# posts by roughly 3x. Hugo auto-detects CJK per page, so English posts are
# unaffected. summaryLength is raised because with CJK counting it means 150
# *characters*, not 150 words -- the default 70 would leave summaries too
# short. MUST stay at the root level: appended at the end of the file these
# keys would be captured by the last TOML table and silently ignored.
hasCJKLanguage = true
summaryLength = 150

# Taxonomy term-index pages (/categories/ and /tags/) are disabled — the blog
# navigates via post cards and the sidebar tag cloud, not browsable indexes.
# Individual term pages (/tags/<tag>/, /categories/<cat>/) are still generated.
disableKinds = ["taxonomy"]

# Google Analytics: previous `UA-8779590-7` was Universal Analytics, retired
# 2023-07. Disabled until a GA4 property ID (format `G-XXXXXXX`) is issued,
# otherwise Hugo injects a dead tracker that ad-blockers flag.
# googleAnalytics = "G-XXXXXXX"

[params]
  description = "Dev Notes and Idea Sharing with ❤"
  author = "Howar31"
  ogImage = "https://blog.howar31.com/logo/og-image.jpg"
  themeColor = "#000000"

# Sponsor / tip links. Only verified platforms — GitHub Sponsors is NOT
# enabled on this account (`howar31`) so do not re-add it without first
# applying + getting approved via github.com/sponsors.
#
# page: the sponsor page `https://donate.howar31.com` — primary CTA, listed
#       first; it routes Taiwan vs international donors itself.
# Ko-fi: user-facing `https://ko-fi.com/howar31` — secondary.
[params.sponsor]
  page = "https://donate.howar31.com"
  kofi = "howar31"

# The top navbar is intentionally minimal — site name + search + GitHub +
# theme toggle. No `[[menu.main]]` entries; `header.html` renders no nav links.

# Footer "About" column.
[[menu.footer]]
  name = "howar31.com"
  url = "https://howar31.com"
  weight = 10
  pre = "globe"

[[menu.footer]]
  name = "GitHub"
  url = "https://github.com/howar31"
  weight = 20
  pre = "github"

[[menu.footer]]
  name = "Source Code"
  url = "https://github.com/howar31/howar31-blog"
  weight = 30
  pre = "code"

[markup]
  [markup.highlight]
    # Disable Hugo's Chroma highlighter. Fenced code blocks are rendered as plain
    # `<pre><code class="language-xxx">` by Goldmark and highlighted client-side
    # by Prism.js (see head.html / baseof.html). Prism's plugin ecosystem gives
    # us language badges, copy button, line numbers, etc. with no custom code.
    codeFences = false
    noClasses = true
  [markup.goldmark.renderer]
    unsafe = true
  [markup.goldmark.parser]
    # Lift standalone images out of <p>. Required so the render-image hook
    # can emit <figure> (a block element) without invalid <p><figure>… HTML.
    wrapStandAloneImageWithinParagraph = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
    ordered = false

[taxonomies]
  category = "categories"
  tag = "tags"

[permalinks]
  # Use parent folder name (e.g. discord-hide-blocked-messages) not title-derived slug.
  posts = "/posts/:contentbasename/"

[sitemap]
  changefreq = "monthly"
  priority = 0.5
  filename = "sitemap.xml"

[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]

[pagination]
  pagerSize = 10
